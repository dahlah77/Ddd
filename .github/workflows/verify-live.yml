# v3 final verification
name: Verify Al-Mursyidul Amin live URL

on:
  push:
    paths:
      - ".github/workflows/verify-live.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check live page
        run: |
          set -e
          URL="https://dahlah7-personal-portfolio1.vercel.app/al-mursyidul-amin/"
          HTTP=$(curl -L -sS -o /tmp/site.html -w "%{http_code}" "$URL")
          echo "HTTP=$HTTP"
          test "$HTTP" = "200"
          grep -q "Pusat Informasi Pesantren" /tmp/site.html
          grep -q "Pesantren yang" /tmp/site.html
          grep -q "Data & Arsip" /tmp/site.html
          grep -q "Struktur Putra & Putri" /tmp/site.html
          BYTES=$(wc -c < /tmp/site.html)
          echo "BYTES=$BYTES"
          test "$BYTES" -gt 80000
          echo "LIVE_V3_OK=$URL"
