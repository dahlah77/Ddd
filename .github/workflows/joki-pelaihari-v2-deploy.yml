name: Joki Pelaihari V2 Isolated Deploy

on:
  push:
    branches:
      - joki-pelaihari-v2-20261004
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      VERCEL_EMAIL: hidayatromi358@gmail.com
      AUTH_BRANCH: joki-pelaihari-v2-auth-20261004
      REPO_SLUG: dahlah77/Ddd
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI and browser driver
        run: |
          npm install --global vercel@latest
          npm init -y >/dev/null 2>&1
          npm install playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Start isolated Vercel device login
        env:
          CI: "false"
        run: |
          rm -f vercel-login.log vercel-login.pid device-url.txt
          nohup vercel login >vercel-login.log 2>&1 &
          echo $! >vercel-login.pid
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' vercel-login.log | tail -1 || true)"
            if [ -n "$URL" ]; then
              echo "$URL" > device-url.txt
              break
            fi
            sleep 1
          done
          test -s device-url.txt
          cat vercel-login.log

      - name: Generate one-time encryption key
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out auth-private.pem
          openssl pkey -in auth-private.pem -pubout -out auth-public.pem

      - name: Upload Vercel auth handoff
        uses: actions/upload-artifact@v4
        with:
          name: vercel-v2-auth-handoff
          path: |
            device-url.txt
            auth-public.pem
          if-no-files-found: error
          retention-days: 1

      - name: Authorize Vercel in persistent browser session
        env:
          CI: "false"
          DEVICE_URL: ${{ steps.device.outputs.url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          export DEVICE_URL="$(cat device-url.txt)"
          node joki-pelaihari-v2/scripts/vercel-auth-agent.mjs

      - name: Confirm CLI authentication
        env:
          CI: "false"
        run: |
          PID="$(cat vercel-login.pid)"
          for i in $(seq 1 60); do
            if ! kill -0 "$PID" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          cat vercel-login.log
          if kill -0 "$PID" 2>/dev/null; then
            kill "$PID" || true
            echo "Vercel CLI authentication did not complete"
            exit 1
          fi
          vercel whoami

      - name: Deploy separate Joki Pelaihari V2 project
        env:
          CI: "false"
        run: |
          cd joki-pelaihari-v2
          vercel --prod --yes --scope hidayatromi358-3418s-projects 2>&1 | tee ../vercel-deploy.log
          grep -Eo 'https://[^[:space:]]+\.vercel\.app' ../vercel-deploy.log | tail -1 > ../vercel-live-url.txt
          test -s ../vercel-live-url.txt
          cat ../vercel-live-url.txt

      - name: Upload deployment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-v2-final-result
          path: |
            vercel-live-url.txt
            vercel-deploy.log
            vercel-login.log
            device-*.txt
            device-*.png
          if-no-files-found: ignore
          retention-days: 1
