name: Joki Pelaihari V2 Isolated Deploy

on:
  push:
    branches:
      - joki-pelaihari-v2-20261004
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Start Vercel device login
        env:
          CI: "false"
        run: |
          rm -f vercel-login.log vercel-login.pid device-url.txt
          nohup vercel login >vercel-login.log 2>&1 &
          echo $! >vercel-login.pid
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://vercel\.com/oauth/device\?user_code=[A-Z0-9-]+' vercel-login.log | tail -1 || true)"
            if [ -n "$URL" ]; then
              echo "$URL" > device-url.txt
              break
            fi
            sleep 1
          done
          test -s device-url.txt
          cat device-url.txt

      - name: Upload login link
        uses: actions/upload-artifact@v4
        with:
          name: vercel-login-link
          path: device-url.txt
          if-no-files-found: error
          retention-days: 1

      - name: Wait until Vercel login is authorized
        env:
          CI: "false"
        run: |
          AUTH_OK=0
          for i in $(seq 1 180); do
            if vercel whoami >/tmp/vercel-whoami.txt 2>/tmp/vercel-whoami.err; then
              AUTH_OK=1
              break
            fi
            sleep 5
          done
          cat vercel-login.log || true
          cat /tmp/vercel-whoami.txt || true
          cat /tmp/vercel-whoami.err || true
          if [ "$AUTH_OK" != "1" ]; then
            echo "Vercel login was not authorized before timeout."
            exit 1
          fi

      - name: Deploy separate Joki Pelaihari V2 project
        env:
          CI: "false"
        run: |
          cd joki-pelaihari-v2
          vercel --prod --yes --scope hidayatromi358-3418s-projects 2>&1 | tee ../vercel-deploy.log
          grep -Eo 'https://[^[:space:]]+\.vercel\.app' ../vercel-deploy.log | tail -1 > ../vercel-live-url.txt
          test -s ../vercel-live-url.txt
          cat ../vercel-live-url.txt

      - name: Make production site public
        env:
          CI: "false"
        run: |
          vercel project protection disable joki-pelaihari-v2 --sso --scope hidayatromi358-3418s-projects
          curl -fsSL --retry 6 --retry-delay 3 https://joki-pelaihari-v2.vercel.app/ -o /tmp/jp-home.html
          grep -qi "JOKI PELAIHARI" /tmp/jp-home.html

      - name: Upload deployment result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-v2-final-result
          path: |
            vercel-live-url.txt
            vercel-deploy.log
            vercel-login.log
          if-no-files-found: ignore
          retention-days: 1
