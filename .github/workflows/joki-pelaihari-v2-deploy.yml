name: Joki Pelaihari V2 Isolated Deploy

on:
  push:
    branches:
      - joki-pelaihari-v2-20261004
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      VERCEL_ORG_ID: team_Kxi4Rlxx7agCcMgkfUQoZodY
      VERCEL_PROJECT_ID: prj_mgk51Zdt0E0HorVBnNtCMezh5dpF
    steps:
      - uses: actions/checkout@v4

      - name: Preflight exact source
        run: |
          grep -Fq '<h2>Layanan Kami</h2>' joki-pelaihari-v2/index.html
          grep -Fq '<h2>Smart Price Calculator</h2>' joki-pelaihari-v2/index.html
          grep -Fq 'Bagian / Jenis Pekerjaan' joki-pelaihari-v2/index.html
          grep -Fq 'BUILD_MARKER_SERVICES_2017' joki-pelaihari-v2/index.html
          if grep -Fq 'Cek estimasi dalam hitungan detik.' joki-pelaihari-v2/index.html; then
            echo "Old calculator heading still exists"
            exit 1
          fi
          if grep -Fq 'Estimasi otomatis ini menggunakan nominal price list utama' joki-pelaihari-v2/index.html; then
            echo "Old estimator notice still exists"
            exit 1
          fi
          if grep -Fq 'Satu tempat. Banyak yang bisa dibantu.' joki-pelaihari-v2/index.html; then
            echo "Old service heading still exists"
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Resolve existing Vercel CI token
        env:
          VERCEL_TOKEN_A: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TOKEN_B: ${{ secrets.VERCEL_ACCESS_TOKEN }}
          VERCEL_TOKEN_C: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_TOKEN_D: ${{ secrets.VERCEL_CLI_TOKEN }}
        run: |
          TOKEN=""
          for V in "$VERCEL_TOKEN_A" "$VERCEL_TOKEN_B" "$VERCEL_TOKEN_C" "$VERCEL_TOKEN_D"; do
            if [ -n "$V" ]; then TOKEN="$V"; break; fi
          done
          if [ -z "$TOKEN" ]; then
            echo "::error::Configure the VERCEL_TOKEN repository secret with a token from an authorized member of hidayatromi358-3418s-projects. Interactive device login is not supported in CI."
            exit 2
          fi
          echo "::add-mask::$TOKEN"
          echo "VERCEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"
          vercel whoami --token "$TOKEN"
          # Check project authorization before any production mutation.
          if ! curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -o "$RUNNER_TEMP/vercel-project.json"; then
            echo "::error::Vercel token cannot access the configured project/team. Check token scope and the token owner's team membership."
            exit 1
          fi
          node -e 'const fs = require("fs"); const p = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + "/vercel-project.json", "utf8")); if (p.id !== process.env.VERCEL_PROJECT_ID || p.accountId !== process.env.VERCEL_ORG_ID || p.name !== "joki-pelaihari-v2") { throw new Error("Unexpected Vercel project/team; refusing production deployment"); }'

      - name: Force fresh production deploy
        run: |
          cd joki-pelaihari-v2
          if ! vercel --prod --yes --force --token "$VERCEL_TOKEN" --scope hidayatromi358-3418s-projects > ../vercel-live-url.txt 2> ../vercel-deploy.log; then
            cat ../vercel-deploy.log
            exit 1
          fi
          cat ../vercel-deploy.log
          DEPLOY_URL="$(tail -1 ../vercel-live-url.txt | tr -d '\r\n')"
          if [[ ! "$DEPLOY_URL" =~ ^https://[a-zA-Z0-9-]+\.vercel\.app$ ]]; then
            echo "::error::Vercel did not return a valid deployment URL; refusing alias update."
            exit 1
          fi
          printf '%s\n' "$DEPLOY_URL" > ../vercel-live-url.txt
          cat ../vercel-live-url.txt

      - name: Force production alias
        run: |
          DEPLOY_URL="$(cat vercel-live-url.txt)"
          vercel alias set "$DEPLOY_URL" joki-pelaihari-v2.vercel.app --token "$VERCEL_TOKEN" --scope hidayatromi358-3418s-projects

      - name: Verify live production
        run: |
          URL="https://joki-pelaihari-v2.vercel.app/?verify=${GITHUB_SHA}"
          for i in $(seq 1 20); do
            if curl -fsSL -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' "$URL" -o live-home.html; then
              if grep -Fq '<h2>Layanan Kami</h2>' live-home.html \
                && grep -Fq '<h2>Smart Price Calculator</h2>' live-home.html \
                && grep -Fq 'Bagian / Jenis Pekerjaan' live-home.html; then
                break
              fi
            fi
            sleep 3
          done
          grep -Fq '<h2>Layanan Kami</h2>' live-home.html
          grep -Fq '<h2>Smart Price Calculator</h2>' live-home.html
          grep -Fq 'Bagian / Jenis Pekerjaan' live-home.html
          ! grep -Fq 'Cek estimasi dalam hitungan detik.' live-home.html
          ! grep -Fq 'Estimasi otomatis ini menggunakan nominal price list utama' live-home.html
          echo "LIVE VERIFIED" | tee live-check.txt

      - name: Upload deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vercel-v2-final-result
          path: |
            vercel-live-url.txt
            vercel-deploy.log
            live-home.html
            live-check.txt
          if-no-files-found: ignore
          retention-days: 1
